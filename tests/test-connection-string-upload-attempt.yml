name: Test connection_string upload attempt (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy source directory
        run: mkdir -p /tmp/upload-src && echo "hello world" > /tmp/upload-src/test.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          container_name: my-container
          source_dir: /tmp/upload-src
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
      - name: Assert action failed at Azure CLI (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the connection string is invalid (fake credentials),
          # but it should have passed all the input validation checks.
          # We expect failure here since we cannot connect to a real Azure storage account.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Azure CLI call as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded — this should not happen with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
