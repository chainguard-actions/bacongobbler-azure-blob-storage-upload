name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy source directory
        run: mkdir -p /tmp/upload-src && echo "hello" > /tmp/upload-src/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          container_name: my-container
          source_dir: /tmp/upload-src
          # Neither connection_string nor sas_token provided — should fail with a clear message
      - name: Assert action failed with missing credentials message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials are provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when neither connection_string nor sas_token was provided"
