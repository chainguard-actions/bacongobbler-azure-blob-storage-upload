name: Test missing source_dir error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          container_name: my-container
          source_dir: ""
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fake;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          # source_dir is empty — should fail with a clear message
      - name: Assert action failed with missing source_dir message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when source_dir is empty, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when source_dir was not set"
