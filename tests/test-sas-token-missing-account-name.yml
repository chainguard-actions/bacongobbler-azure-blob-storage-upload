name: Test sas_token without account_name error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy source directory
        run: mkdir -p /tmp/upload-src && echo "hello" > /tmp/upload-src/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          container_name: my-container
          source_dir: /tmp/upload-src
          sas_token: "sv=2021-01-01&ss=b&srt=sco&sp=rwdlacupiytfx&se=2099-01-01T00:00:00Z&st=2021-01-01T00:00:00Z&spr=https&sig=fakesig"
          # account_name is intentionally omitted — should fail with a clear message
      - name: Assert action failed with missing account_name message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when sas_token is provided without account_name, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when sas_token was provided without account_name"
